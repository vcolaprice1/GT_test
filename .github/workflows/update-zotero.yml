name: Aggiorna Zotero e pubblica
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Test di regressione sul dataset di riferimento
        run: |
          python -m unittest discover -s tools -p 'test_*.py'
          node --test tools/test_app.cjs
      - name: Prepara i soli file pubblici
        run: |
          mkdir _site
          cp index.html app.js styles.css .nojekyll _site/
          cp -R assets data _site/
      - uses: actions/cache/restore@v4
        with:
          path: .geocache
          key: geocoding-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: geocoding-
      - name: Aggiorna dalla libreria Zotero
        env:
          ZOTERO_API_KEY: ${{ secrets.ZOTERO_API_KEY }}
          GEOCODER_URL: ${{ vars.GEOCODER_URL }}
        run: python tools/import_zotero_api.py --output _site/data/catalogo.json
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: .geocache
          key: geocoding-${{ github.run_id }}-${{ github.run_attempt }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Pubblica
        id: deployment
        uses: actions/deploy-pages@v4
